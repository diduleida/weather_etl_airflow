services:
  minio:
    image: minio/minio
    # server - запусти MinIO як object storage server (команда MinIO)
    # /data - шлях до папки всередині сервера  (для зберігання даних)
    command: server /data
    # передаємо змінні оточення всередину контейнера (паролі, ключі, режими роботи і дт)
    environment:
      - MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    

volumes:
  minio_data: