services:
  minio:
    image: minio/minio  
    # server - запусти MinIO як object storage server (команда MinIO)
    # /data - шлях до папки всередині сервера  (для зберігання даних)
    command: server /data
    # передаємо змінні оточення всередину контейнера (паролі, ключі, режими роботи і дт)
    environment:
      - MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER: ${POSTGRES_USER}
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      - POSTGRES_BD: ${POSTGRES_BD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      # тут зберігаються дані
      - postgres_data:/var/lib/postgresql/data
      # шо треба виконати під час першої ініціалізації PostgreSQL
      - ./sql/create:/docker-entrypoint-initdb.d

volumes:
  minio_data:
  postgres_data: